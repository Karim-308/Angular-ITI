@for (todo of todos; track todo.id) {
    <div class="todo-item">
      <input type="checkbox" [checked]="todo.completed"
  (change)="toggleTodo(todo.id)" />
      <span class="todo-title" [ngClass]="{ 'completed': todo.completed }">{{   
  todo.title }}</span>
      <button class="btn-remove" (click)="removeTodo(todo.id)">Remove</button>  
    </div>
  }
