<div class="p-8">
    <h1 class="text-2xl font-bold mb-4">Your Cart</h1>
    @if(data.length > 0) {
    <div >
        @for (item of data; track item.product.id) {
    <div class="flex items-center justify-between mb-4 p-4 bg-white rounded shadow">
    <div class="flex items-center gap-4">
        <img [src]="item.product.thumbnail" alt="{{ item.product.title }}" class="w-16 h-16 object-contain">
        <div>
            <h2 class="font-semibold text-gray-800">{{ item.product.title }}</h2>
            <p class="text-gray-500 text-sm">${{ item.product.price }}</p>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <button class="bg-gray-200 px-3 py-1 rounded hover:bg-gray-300" [disabled]="item.quantity <= 1" (click)="cartData.updateQuantity(item.product, item.quantity - 1)">-</button>
        <span class="font-semibold">{{ item.quantity }}</span>
        <button class="bg-gray-200 px-3 py-1 rounded hover:bg-gray-300" (click)="cartData.updateQuantity(item.product, item.quantity + 1)">+</button>
        <button class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 ml-4" (click)="cartData.removeFromCart(item.product)">Remove</button>
    </div>
</div>

        }
        <div class="text-right mt-6">
            <span class="text-xl font-bold">Total: {{ cartData.getTotal() }}</span>
        </div>
    </div>
} @else {

        <p>Your cart is empty. Start adding some products!</p>
    }
</div>
