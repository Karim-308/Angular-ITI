<div [routerLink]="['/product', product.id]" class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition-shadow relative">
    <span class="absolute top-3 left-3 text-xs font-semibold px-3 py-1 rounded-full"
          [class]="product.stock > 0 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'">
        {{ product.stock | stockStatus }}
    </span>
    <div class="h-48 flex items-center justify-center bg-gray-50 p-4">
        <img [src]="product.thumbnail" [alt]="product.title" class="max-h-full object-contain">
    </div>
    <div class="p-4">
        <h2 class="font-semibold text-gray-800 text-sm mb-1 truncate">{{ product.title }}</h2>
        <p class="text-gray-400 text-xs mb-3 line-clamp-2">{{ product.description }}</p>
        <div class="flex items-center justify-between">
            <span class="text-lg font-bold text-gray-900">${{ product.price }}</span>
            <button class="bg-pink-500 text-white text-xs px-4 py-2 rounded-lg hover:bg-pink-600 transition-colors"
                    [disabled]="product.stock === 0"
                    [class.opacity-50]="product.stock === 0"
                    [class.cursor-not-allowed]="product.stock === 0">
                Add to Cart
            </button>
        </div>
    </div>
</div>
