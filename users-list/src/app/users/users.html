<div class="container">
    <h2 class="title">Users</h2>                             
    
    <div class="search-container">
      <input type="text" placeholder="Search by email" [(ngModel)]="searchEmail" (keyup)="search()" />
    </div>
  
    <div class="cards">
      @for (user of filteredUsers; track user.id) {
        <div class="card">
            <img [src]="'https://i.pravatar.cc/150?img=' + user.id" [alt]="user.username"  
            class="avatar" />
          <span class="chip" [ngClass]="{
            'chip-admin': user.role === 'admin',     
            'chip-user': user.role === 'user',       
            'chip-moderator': user.role ===
  'moderator'
          }">
            {{ user.role }}
          </span>
<div class="user-info">
          <p><strong>{{ user.username }}</strong></p>
            <p>{{ user.email }}</p>
            <p>{{ user.phone }}</p>
            <p>{{ user.birthdate }}</p>
          </div>
        </div>
      }
    </div>
  </div>
